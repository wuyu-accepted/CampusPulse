<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#142039"/></linearGradient></defs>
<style>.title{font:700 36px 'Microsoft YaHei',sans-serif;fill:#f8fbff}.sub{font:16px 'Microsoft YaHei',sans-serif;fill:#9fb0cb}.h2{font:700 23px 'Microsoft YaHei',sans-serif;fill:#f3f7ff}.h3{font:700 17px 'Microsoft YaHei',sans-serif;fill:#75ead2}.body{font:16px 'Microsoft YaHei',sans-serif;fill:#dbe5f3}.quote{font:15px 'Microsoft YaHei',sans-serif;fill:#cbd8ea}.small{font:13px 'Microsoft YaHei',sans-serif;fill:#91a2bc}.tag{font:700 14px 'Microsoft YaHei',sans-serif;fill:#07111f}</style>
<rect width="1440" height="900" fill="url(#bg)"/><circle cx="1260" cy="80" r="210" fill="#725cff" opacity=".08"/><circle cx="1120" cy="760" r="260" fill="#39d8b5" opacity=".06"/>
<text x="70" y="64" class="title">同一场讲座风波，两个校园论坛走向了哪里？</text>
<text x="70" y="96" class="sub">不是预测一条情绪曲线，而是观察治理信息进入真实 LLM 讨论后被怎样追问、质疑和使用</text>
<g transform="translate(70 124)"><rect width="1300" height="122" rx="22" fill="#111d32" stroke="#314564"/><rect x="24" y="22" width="72" height="28" rx="14" fill="#ffb65c"/><text x="60" y="42" text-anchor="middle" class="tag">事件</text><text x="116" y="44" class="h2">一场校园讲座中，受邀从业者公开辱骂、贬损学生并提前离场，随后公开道歉。</text><text x="116" y="91" class="body">侮辱性言行和道歉是已知事实；完整逐字稿、动机、正式处置和学生支持仍未知。</text></g>
<g transform="translate(70 278)"><rect width="620" height="392" rx="22" fill="#111d32" stroke="#33445f"/><text x="28" y="46" class="h2">Natural：学生彼此讨论，但没人能回答“谁负责”</text><text x="28" y="78" class="small">没有治理角色发言，论坛主要依靠同伴解释、安慰和互相找办法。</text><text x="28" y="120" class="h3">一个自然形成的讨论</text><rect x="28" y="138" width="564" height="102" rx="14" fill="#0b1628"/><text x="48" y="168" class="quote">辱骂学生这件事已经有报道和道歉支持，不该被“语境不完整”带过。更想知</text><text x="48" y="192" class="quote">道：受影响的同学现在能找谁聊聊、获得什么实际陪伴？</text><text x="28" y="282" class="h3">讨论后来走向</text><rect x="28" y="300" width="564" height="66" rx="14" fill="#0b1628"/><text x="48" y="328" class="quote">如果只提交“需要陪同/转介”，学生怎么确认已经有人接手？会有固定联系</text><text x="48" y="352" class="quote">人或回执渠道吗？</text></g>
<g transform="translate(720 278)"><rect width="650" height="392" rx="22" fill="#101d31" stroke="#39cdb1"/><text x="28" y="46" class="h2">治理 D：公告没有终止争论，反而成了追问对象</text><text x="28" y="78" class="small">治理角色发布事实边界、服务回执和跨群触达；居民可以直接回复，而不是被要求接受。</text><text x="28" y="118" class="h3">治理说</text><text x="28" y="146" class="quote">已确认讲座中存在辱骂学生行为；完整逐字稿、动机及后续处置仍未知。学校将在虚拟</text><text x="28" y="169" class="quote">治理公告栏发布事实更新，并由治理复核角色于48小时内复核。</text><text x="28" y="226" class="h3">居民直接追问</text><text x="28" y="254" class="quote">这张事实卡的边界我能接受：已确认的是辱骂，没确认的别硬补。但“后续怎么保障学</text><text x="28" y="277" class="quote">生安全感”还不能只停在公告里，至少要说明学生反馈和复核结果会怎么被看见。</text><text x="28" y="334" class="h3">服务后来发生了什么</text><text x="28" y="362" class="quote">当前时段还没有形成居民求助、服务回应、居民继续追问的完整来回。</text></g>
<g transform="translate(70 704)"><rect width="1300" height="132" rx="22" fill="#0e192b" stroke="#2b4364"/><text x="28" y="42" class="h2">结果，说人话</text><text x="28" y="76" class="body">治理没有让论坛安静下来。Natural 更像许多分散的小讨论；治理 D 把更多人拉进少数核心线程，大家围绕谁负责、何时公布、能否匿名求助不断追问。</text><text x="28" y="102" class="body">服务开始被看见，但问题并没有自动解决。</text></g>
<text x="70" y="875" class="small">单场景、单种子 T3–T10；主实验未给居民安排定向求证或求助任务；所有可见论坛文字来自授权 LLM。</text>
</svg>