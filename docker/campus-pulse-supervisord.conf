[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:campus-pulse-api]
command=/usr/local/bin/python -m backend.campus_pulse_app
directory=/app
user=campuspulse
priority=10
autostart=true
autorestart=true
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/app/src",PORT="8000",CAMPUS_PULSE_BIND_HOST="127.0.0.1"

[program:campus-pulse-runtime-worker]
command=/usr/local/bin/python /app/scripts/campus_pulse/run_runtime_worker.py
directory=/app
user=campuspulse
priority=20
autostart=true
autorestart=true
startsecs=1
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=PYTHONPATH="/app/src"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
stopsignal=QUIT
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
