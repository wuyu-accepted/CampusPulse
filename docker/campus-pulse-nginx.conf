user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 256k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy \
            "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" \
            always;

        location = /health {
            access_log off;
            proxy_pass http://127.0.0.1:8000/health;
            proxy_set_header Host $host;
        }

        location = /ready {
            access_log off;
            proxy_pass http://127.0.0.1:8000/ready;
            proxy_set_header Host $host;
        }

        # Only the dedicated allow-listed CampusPulse API is reachable.
        location ^~ /api/campus-pulse/v1/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        location = /api/campus-pulse/v1 {
            return 308 /api/campus-pulse/v1/;
        }

        # Fail closed for every upstream OneSim or unknown API route.
        location ^~ /api/ {
            return 404;
        }

        location = /docs {
            return 404;
        }

        location = /openapi.json {
            return 404;
        }

        location / {
            root /var/www/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|woff2?)$ {
            root /var/www/html;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri =404;
        }
    }
}
